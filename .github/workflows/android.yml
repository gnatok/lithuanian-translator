name: Android POC
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Fetch verified speech runtime
        run: bash scripts/fetch-sherpa.sh
      - name: Verify and assemble
        run: ./gradlew --no-daemon :core:test :phone:testDebugUnitTest :phone:lintDebug :wear:lintDebug :phone:assembleDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: phone-and-watch-debug-apks
          path: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            phone/build/reports/tests/
            phone/build/reports/lint-results-debug.*
            wear/build/reports/lint-results-debug.*
